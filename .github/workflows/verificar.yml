# A verificação que faltava.
#
# O computador do dono não tem Node, e o repositório não tinha workflow
# nenhum: os 117 ficheiros de teste nunca corriam sozinhos, e a única rede
# era a build do Vercel — que verifica tipos mas não corre testes. Muitos
# destes testes lêem o código-fonte e exigem frases exactas, por isso são
# precisamente eles que apanham um refactor de texto.
#
# PORQUE É QUE ISTO CUSPE `::error::`
#
# Os registos de um workflow só se descarregam com direitos de administrador
# do repositório. As ANOTAÇÕES, não: qualquer um as lê pela API pública. Por
# isso o que falha sai também como anotação — é o único caminho por onde o
# resultado chega a quem está a corrigir sem poder abrir os registos.
name: Verificar

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version`: o package.json já traz `packageManager: pnpm@10.4.1`,
      # e esta acção recusa-se a arrancar quando lhe dizem a versão duas vezes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      # Os dois correm sempre, mesmo que o primeiro chumbe: quem lê o
      # resultado quer saber tudo o que está mal, não a primeira coisa.
      - name: Tipos e testes
        run: |
          set +e
          falhou=0

          anotar() {
            # Uma anotação por linha, sem os caracteres que partem o formato.
            printf '%s\n' "$2" | tail -n 30 | while IFS= read -r linha; do
              limpa=$(printf '%s' "$linha" | tr -d '\r' | sed 's/%/%25/g')
              [ -n "$limpa" ] && echo "::error title=$1::$limpa"
            done
          }

          echo "──────── pnpm check ────────"
          saida=$(pnpm check 2>&1); rc=$?
          printf '%s\n' "$saida"
          if [ $rc -ne 0 ]; then falhou=1; anotar "tipos" "$saida"; fi

          echo "──────── pnpm test ────────"
          saida=$(pnpm test 2>&1); rc=$?
          printf '%s\n' "$saida"
          if [ $rc -ne 0 ]; then
            falhou=1
            # Só o que interessa: os nomes dos testes que falharam e o resumo.
            resumo=$(printf '%s\n' "$saida" | grep -E "^ *(FAIL|×|✗)|Tests +[0-9]+ failed|Test Files +[0-9]+ failed|AssertionError|Expected|Received" | head -n 30)
            [ -z "$resumo" ] && resumo=$(printf '%s\n' "$saida" | tail -n 30)
            anotar "testes" "$resumo"
          fi

          exit $falhou

      # OS TIPOS DA APP CLYON PRO — 25-10-2026.
      #
      # A app (app-pro/) tem pacotes e tsconfig próprios, e o tsconfig do site
      # deixa-a de fora. Ela importa dezenas de ficheiros de src/lib, que mudam
      # todos os dias: um tipo partido só se via no EAS Update ou na build
      # seguinte. Corre mesmo que os testes do site chumbem, pela mesma razão
      # do passo de cima: saber tudo o que está mal de uma vez.
      - name: Cache dos pacotes da app
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-app-pro-${{ runner.os }}-${{ hashFiles('app-pro/package-lock.json') }}
          restore-keys: npm-app-pro-${{ runner.os }}-

      - name: Tipos da app
        if: ${{ !cancelled() }}
        working-directory: app-pro
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          set +e
          echo "──────── tsc da app ────────"
          saida=$(npx tsc --noEmit 2>&1); rc=$?
          printf '%s\n' "$saida"
          if [ $rc -ne 0 ]; then
            printf '%s\n' "$saida" | tail -n 30 | while IFS= read -r linha; do
              limpa=$(printf '%s' "$linha" | tr -d '\r' | sed 's/%/%25/g')
              [ -n "$limpa" ] && echo "::error title=tipos da app::$limpa"
            done
          fi
          exit $rc

      # A app de cliente (app-cliente/, d8 de 27-10-2026): pacotes e tsconfig
      # próprios, como a Pro. Corre mesmo que os passos de cima chumbem.
      - name: Cache dos pacotes da app de cliente
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-app-cliente-${{ runner.os }}-${{ hashFiles('app-cliente/package-lock.json') }}
          restore-keys: npm-app-cliente-${{ runner.os }}-

      - name: Tipos da app de cliente
        if: ${{ !cancelled() }}
        working-directory: app-cliente
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          set +e
          echo "──────── tsc da app de cliente ────────"
          saida=$(npx tsc --noEmit 2>&1); rc=$?
          printf '%s\n' "$saida"
          if [ $rc -ne 0 ]; then
            printf '%s\n' "$saida" | tail -n 30 | while IFS= read -r linha; do
              limpa=$(printf '%s' "$linha" | tr -d '\r' | sed 's/%/%25/g')
              [ -n "$limpa" ] && echo "::error title=tipos da app de cliente::$limpa"
            done
          fi
          exit $rc
